  <script type="text/babel" data-presets="react-classic">
    const { useState, useEffect, useMemo } = React;

    // --- 유령 숫자 소거 헬퍼 함수 ---
    const cleanWordText = (word) => {
      if (!word) return "";
      return word.replace(/\(.*?\)/g, "").replace(/_\d+/g, "").trim();
    };

    // --- 한국어 조사 자동 판별 헬퍼 함수 ---
    const getJosa = (word, josaType) => {
      const clean = cleanWordText(word);
      if (clean.length === 0) return "";
      const lastChar = clean.charCodeAt(clean.length - 1);
      // 한글 유니코드 판별
      if (lastChar < 0xAC00 || lastChar > 0xD7A3) {
        return josaType === '이/가' ? '이' : (josaType === '은/는' ? '은' : '을');
      }
      const hasBatchim = (lastChar - 0xAC00) % 28 > 0;
      if (josaType === '이/가') {
        return hasBatchim ? '이' : '가';
      } else if (josaType === '은/는') {
        return hasBatchim ? '은' : '는';
      } else if (josaType === '을/를') {
        return hasBatchim ? '을' : '를';
      }
      return "";
    };

    // --- Externalized LEET Dataset Reference & Smart Merging ---
    if (window.MOCK_WORDS) {
      const cleanWords = {};
      Object.keys(window.MOCK_WORDS).forEach(key => {
        const item = window.MOCK_WORDS[key];
        if (!item) return;
        const cleaned = cleanWordText(item.word || key);
        if (!cleanWords[cleaned]) {
          const newItem = { ...item };
          newItem.word = cleaned;
          if (newItem.sound) {
            newItem.sound = cleanWordText(newItem.sound);
          }
          newItem.contexts = newItem.contexts ? [...newItem.contexts] : [];
          cleanWords[cleaned] = newItem;
        } else {
          // Smart Merging: Push contexts from duplicates into the same card
          if (item.contexts && Array.isArray(item.contexts)) {
            cleanWords[cleaned].contexts.push(...item.contexts);
          }
        }
      });
      window.MOCK_WORDS = cleanWords;

          <path strokeLinecap="round" strokeLinejoin="round" d="M15.362 5.214A8.252 8.252 0 0 1 12 21 8.25 8.25 0 0 1 6.038 7.047 8.287 8.287 0 0 0 9 9.601a8.983 8.983 0 0 1 3.361-6.867 8.21 8.21 0 0 0 3 2.48Z" />
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 18a3.75 3.75 0 0 0 .495-7.467 5.99 5.99 0 0 0-1.925 3.546 5.974 5.974 0 0 1-2.133-1A3.75 3.75 0 0 0 12 18Z" />
        </svg>
      );

    // Dynamic category icon helper
    const getCategoryIcon = (category, className) => {

        case "법률기초":
          return <BookmarkIcon className={className} />;

      }
    };

    // --- Main App React Component ---
    function App() {
      console.log("DEBUG: App component render initialized (한알국쉬(리트버전) Lavender Mode)");
      const [selectedWord, setSelectedWord] = useState(null);

      const [activeCardContexts, setActiveCardContexts] = useState({});
      const [activeDetailContext, setActiveDetailContext] = useState(0);
      const [todayWord, setTodayWord] = useState(null);
      const [sortByFrequency, setSortByFrequency] = useState(false);

      // --- 아는 단어 패스 기능 States & Handlers ---

      const closeDetailView = (callback) => {

        setTimeout(() => {
          setSelectedWord(null);
          setIsClosingDetail(false);
          if (callback) callback();

      };

      const handleMasterWord = (wordKey) => {
        setPassedWords(prev => {
          if (!prev.includes(wordKey)) {
            return [...prev, wordKey];
          }
          return prev;
        });
        showToast("🎉 축하합니다! 마스터한 어휘로 등록되었습니다.");
        closeDetailView();
      };

      useEffect(() => {
        try {
          localStorage.setItem("passed_words", JSON.stringify(passedWords));

      // 수험생 예문 피드(dynamicFeeds)도 브라우저 재접속 시 유지되도록 localStorage에 자동 저장
      useEffect(() => {

      const handlePassWord = (wordKey, e) => {
        if (e) e.stopPropagation();

        setTimeout(() => {
          setPassedWords(prev => {
            if (!prev.includes(wordKey)) {
              return [...prev, wordKey];

          setFadingKeys(prev => prev.filter(k => k !== wordKey));
          // 상세 카드 초기화

      };

      const handleResetPassed = () => {
        if (confirm("학습 기록을 초기화하시겠습니까? 외운 단어들이 모두 복구됩니다.")) {
          setPassedWords([]);

      };

      // --- 한자-한글 실시간 스위칭 토글 상태 ---
      const [showHanjaInContext, setShowHanjaInContext] = useState(false);

      // --- 5지선다 객관식 미니 퀴즈(Mini Quiz) States & Handlers ---
      const [showQuizModal, setShowQuizModal] = useState(false);
      const [quizQuestions, setQuizQuestions] = useState([]);
      const [currentQuizIndex, setCurrentQuizIndex] = useState(0);
      const [quizScore, setQuizScore] = useState(0);
      const [selectedOptionIndex, setSelectedOptionIndex] = useState(null);
      const [isQuizFinished, setIsQuizFinished] = useState(false);

      const handleStartQuiz = () => {
        const keys = Object.keys(MOCK_WORDS);
        if (keys.length < 5) {
          alert("퀴즈를 생성하기 위한 어휘 데이터가 부족합니다.");
          return;
        }
        
        // 5개 단어를 랜덤하게 셔플
        const shuffledKeys = [...keys].sort(() => 0.5 - Math.random());
        const selectedKeys = shuffledKeys.slice(0, 5);
        
        const questions = selectedKeys.map(key => {
          const correctWord = MOCK_WORDS[key];
          const correctHanja = correctWord.hanja;
          const cleanCorrectWord = cleanWordText(correctWord.word);
          
          // 오답 한자 4개 선택 (정답 한자와 중복되지 않음)
          const incorrectHanjas = [];
          while (incorrectHanjas.length < 4) {
            const rKey = keys[Math.floor(Math.random() * keys.length)];
            const rWord = MOCK_WORDS[rKey];
            if (rWord.hanja !== correctHanja && !incorrectHanjas.includes(rWord.hanja)) {
              incorrectHanjas.push(rWord.hanja);
            }
          }
          
          // 정답 + 오답 셔플하여 5개 선지 구성
          const options = [correctHanja, ...incorrectHanjas].sort(() => 0.5 - Math.random());
          
          // 지문 문맥 획득
          const contextObj = correctWord.contexts && correctWord.contexts[0];
          const contextText = contextObj ? (contextObj.content || contextObj.desc) : `이 단어의 본래 문맥적 용례는 [${cleanCorrectWord}]입니다.`;
          
          return {
            key: key,
            word: cleanCorrectWord,
            correctHanja: correctHanja,
            brief: correctWord.brief,
            definition: correctWord.definition,
            context: contextText,
            options: options
          };
        });
        
        setQuizQuestions(questions);
        setCurrentQuizIndex(0);
        setQuizScore(0);
        setSelectedOptionIndex(null);
        setIsQuizFinished(false);
        setShowQuizModal(true);
      };

      const handleSelectOption = (optIdx) => {
        if (selectedOptionIndex !== null) return;
        setSelectedOptionIndex(optIdx);
        const question = quizQuestions[currentQuizIndex];
        if (question.options[optIdx] === question.correctHanja) {
          setQuizScore(prev => prev + 1);
        }
      };

      const handleNextQuestion = () => {
        setSelectedOptionIndex(null);
        if (currentQuizIndex < 4) {
          setCurrentQuizIndex(prev => prev + 1);
        } else {
          setIsQuizFinished(true);
        }
      };

      // --- Admin Tool States & Handlers ---
      const [showAdmin, setShowAdmin] = useState(false);

      // --- 관리자 패널 비밀번호 잠금 (해시로만 저장, 평문 비밀번호는 코드에 남기지 않음) ---
      const ADMIN_PASSWORD_HASH = "7361edda0500d8fe1d2c12250a2b513ae96b17d6e2760c9190ce15b469270acb";
      const [showAdminAuth, setShowAdminAuth] = useState(false);
      const [adminPasswordInput, setAdminPasswordInput] = useState("");
      const [adminAuthError, setAdminAuthError] = useState("");

      const sha256Hex = async (text) => {
        const encoder = new TextEncoder();
        const data = encoder.encode(text);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("");
      };

      // 푸터의 숨겨진 점(•)을 클릭했을 때: 이미 이 탭에서 인증했으면 바로 열고, 아니면 비밀번호 입력창을 띄움
      const handleAdminBulletClick = () => {
        try {
          if (sessionStorage.getItem("admin_unlocked") === "true") {
            setShowAdmin(true);
            return;
          }
        } catch (e) { /* sessionStorage 접근 불가 시 그냥 아래로 진행 */ }
        setAdminPasswordInput("");
        setAdminAuthError("");
        setShowAdminAuth(true);
      };

      const handleAdminAuthSubmit = async (e) => {
        if (e) e.preventDefault();
        try {
          const hash = await sha256Hex(adminPasswordInput.trim());
          if (hash === ADMIN_PASSWORD_HASH) {
            try { sessionStorage.setItem("admin_unlocked", "true"); } catch (e2) {}
            setShowAdminAuth(false);
            setShowAdmin(true);
          } else {
            setAdminAuthError("비밀번호가 올바르지 않습니다.");
          }
        } catch (e3) {
          setAdminAuthError("인증 처리 중 오류가 발생했습니다. (이 브라우저가 암호화 기능을 지원하지 않을 수 있습니다)");
        }
      };

      // 관리자 패널을 닫으면서 이 탭의 인증 상태도 해제(잠금)하고 싶을 때 사용
      const handleAdminLock = () => {
        try { sessionStorage.removeItem("admin_unlocked"); } catch (e) {}
        setShowAdmin(false);
      };

      const [adminSelectedWordKey, setAdminSelectedWordKey] = useState("");
      const [adminUpdateCount, setAdminUpdateCount] = useState(0); // For forcing re-render when dataset updates
      const [adminSearchTerm, setAdminSearchTerm] = useState("");

      // --- 원클릭 저장을 위한 File System Access API 상태 ---
      // 이 브라우저/환경이 파일 직접 쓰기를 지원하는지 여부 (Chrome/Edge + https 또는 localhost 환경 필요)
      const supportsFileSystemAccess = typeof window !== "undefined" && "showOpenFilePicker" in window;
      const [connectedFileHandle, setConnectedFileHandle] = useState(null);

      const handleConnectDataFile = async () => {
        try {
          const [handle] = await window.showOpenFilePicker({
            types: [{ description: "leet_data.js", accept: { "text/javascript": [".js"] } }],
            excludeAcceptAllOption: false,
            multiple: false
          });
          const permission = await handle.requestPermission({ mode: "readwrite" });
          if (permission !== "granted") {
            alert("파일 쓰기 권한이 허용되지 않았습니다. 다시 시도해 주세요.");
            return;
          }
          setConnectedFileHandle(handle);
          showToast("🔗 " + handle.name + " 파일에 연결되었습니다.");
        } catch (e) {
          // 사용자가 파일 선택창을 취소한 경우는 조용히 무시
          if (e && e.name !== "AbortError") {
            console.error("File connect failed", e);
            alert("파일 연결 중 오류가 발생했습니다: " + e.message);
          }
        }
      };

      // When word is selected in admin panel, initialize editing values
      const [editBrief, setEditBrief] = useState("");
      const [editHanja, setEditHanja] = useState("");
      const [editWord, setEditWord] = useState("");
      const [editContexts, setEditContexts] = useState([]);

      useEffect(() => {
        if (adminSelectedWordKey && MOCK_WORDS[adminSelectedWordKey]) {
          const w = MOCK_WORDS[adminSelectedWordKey];
          setEditWord(w.word || "");
          setEditHanja(w.hanja || "");
          setEditBrief(w.brief || "");
          setEditContexts(JSON.parse(JSON.stringify(w.contexts || [])));
        } else {
          setEditWord("");
          setEditHanja("");
          setEditBrief("");
          setEditContexts([]);
        }
      }, [adminSelectedWordKey]);

      const handleSaveWord = () => {
        if (!adminSelectedWordKey || !MOCK_WORDS[adminSelectedWordKey]) return;
        const target = MOCK_WORDS[adminSelectedWordKey];
        
        // Apply modifications
        target.word = editWord;
        target.hanja = editHanja;
        target.brief = editBrief;
        target.contexts = editContexts;

        // If the word key itself changed, re-map it in window.MOCK_WORDS
        if (adminSelectedWordKey !== editWord && editWord.trim() !== "") {
          MOCK_WORDS[editWord] = target;
          delete MOCK_WORDS[adminSelectedWordKey];
          setAdminSelectedWordKey(editWord);
        }

        setAdminUpdateCount(prev => prev + 1);
        showToast("✏️ 수정사항이 메모리에 반영되었습니다. 하단의 저장 버튼을 눌러 파일에 반영하세요.");
      };

      const handleExportData = async () => {
        const fileContent = "// --- Extracted LEET Dataset for Hanja Urban Dictionary (Hanal Gukshi - Leet Version) ---\nwindow.MOCK_WORDS = " + JSON.stringify(MOCK_WORDS, null, 2) + ";\n";

        // 파일이 연결되어 있으면 다운로드 없이 바로 그 파일에 덮어쓴다
        if (connectedFileHandle) {
          try {
            const writable = await connectedFileHandle.createWritable();
            await writable.write(fileContent);
            await writable.close();
            showToast("💾 " + connectedFileHandle.name + " 파일에 바로 저장되었습니다!");
            return;
          } catch (e) {
            console.error("Direct file write failed", e);
            alert("연결된 파일에 직접 저장하는 데 실패했습니다. 대신 다운로드로 저장합니다.\n(" + e.message + ")");
            // 실패 시 아래 다운로드 방식으로 폴백
          }
        }

        const blob = new Blob([fileContent], { type: "application/javascript;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "leet_data.js";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };


      // Select random word on mount
      useEffect(() => {
        if (MOCK_WORDS) {
          const keys = Object.keys(MOCK_WORDS);
          if (keys.length > 0) {
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            setTodayWord(MOCK_WORDS[randomKey]);
          }
        }
      }, []);

      const selectAndScrollToWord = (wordObj) => {
        if (!wordObj) return;
        setSelectedWord(wordObj);
        setActiveDetailContext(0);
        if (!dynamicFeeds[wordObj.word]) {
          setDynamicFeeds(prev => {
            const next = Object.assign({}, prev);
            next[wordObj.word] = wordObj.feed;
            return next;
          });
        }
        setTimeout(() => {
          const element = document.getElementById("detail-card");
          if (element) {
            element.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }, 100);
      };

      const [newAuthor, setNewAuthor] = useState("");
      const [newGrade, setNewGrade] = useState("로스쿨준비생");
      const [newSourceBook, setNewSourceBook] = useState("");
      const [newExample, setNewExample] = useState("");
      const [feedError, setFeedError] = useState("");

      const handleAddFeed = (e) => {
        e.preventDefault();
        if (!newAuthor.trim()) {
          setFeedError("닉네임을 입력해주십시오.");
          return;
        }
        if (!newExample.trim()) {
          setFeedError("찰진 예문을 입력해주십시오.");
          return;
        }
        if (newExample.trim().length < 10) {
          setFeedError("문맥이 확실히 느껴지도록 최소 10자 이상 작성해주십시오.");
          return;
        }
        const cleanTargetWord = cleanWordText(selectedWord.word);
        if (!newExample.includes(cleanTargetWord)) {
          setFeedError("예문에 해당 표제어 '" + cleanTargetWord + "'" + getJosa(cleanTargetWord, "이/가") + " 반드시 포함되어야 합니다.");
          return;
        }

        const newFeedItem = {
          id: Date.now(),
          author: newAuthor.trim(),
          grade: newGrade,
          sourceBook: newSourceBook.trim() || undefined,
          example: newExample.trim(),
          upvotes: 1,
          downvotes: 0,
          createdAt: "방금 전",
          comments: []
        };

        setDynamicFeeds(prev => {
          const next = Object.assign({}, prev);
          const currentList = prev[selectedWord.word] || [];
          next[selectedWord.word] = [newFeedItem].concat(currentList);
          return next;
        });

        setNewAuthor("");
        setNewSourceBook("");
        setNewExample("");
        setFeedError("");
      };

      const handleVote = (feedId, type) => {
        const wordKey = selectedWord.word;
        setDynamicFeeds(prev => {
          const next = Object.assign({}, prev);
          const currentFeeds = prev[wordKey] || [];
          next[wordKey] = currentFeeds.map(item => {
            if (item.id === feedId) {
              return Object.assign({}, item, {
                upvotes: type === 'up' ? item.upvotes + 1 : item.upvotes,
                downvotes: type === 'down' ? item.downvotes + 1 : item.downvotes
              });
            }
            return item;
          });
          return next;
        });
      };

      // 개편된 selectedClassicalFilter (중복 제거 Deduplication 가미)
      const baseKeys = useMemo(() => {
        if (!MOCK_WORDS) return [];
        const allKeys = Object.keys(MOCK_WORDS);
        
        // cleanWordText 기준으로 중복 제거
        const uniqueKeys = [];
        const seenWords = new Set();
        
        allKeys.forEach(k => {
          const item = MOCK_WORDS[k];
          if (!item) return;
          const cleaned = cleanWordText(item.word);
          if (!seenWords.has(cleaned)) {
            seenWords.add(cleaned);
            uniqueKeys.push(k);
          }
        });
        
        // 외운 단어 스크리닝 (fadingKeys에 들어간 애니메이션 도중인 키는 일단 렌더링 유지)
        const activeKeys = uniqueKeys.filter(k => !passedWords.includes(k) || fadingKeys.includes(k));
        
        if (selectedClassicalFilter === "전체") {
          return activeKeys;
        }
        
        return activeKeys.filter(k => {
          const item = MOCK_WORDS[k];
          const query = selectedClassicalFilter; // "추리논증" 또는 "언어이해"
          
          // 1. tags 확인
          if (item.tags && item.tags.some(t => t.includes(query))) {
            return true;
          }
          // 2. contexts의 source나 title 확인
          if (item.contexts && item.contexts.some(ctx => 
            (ctx.source && ctx.source.includes(query)) || 
            (ctx.title && ctx.title.includes(query)) ||
            (ctx.content && ctx.content.includes(query)) ||
            (ctx.desc && ctx.desc.includes(query))
          )) {
            return true;
          }
          // 3. feed의 sourceBook 확인
          if (item.feed && item.feed.some(f => f.sourceBook && f.sourceBook.includes(query))) {
            return true;
          }
          // 4. category / type 확인
          if ((item.type && item.type.includes(query)) || (item.category && item.category.includes(query))) {
            return true;
          }
          return false;
        });
      }, [selectedClassicalFilter, passedWords, fadingKeys]);

      const categoryFilteredWords = useMemo(() => {
        if (selectedCategory === "전체보기") {
          return baseKeys;
        }
        return baseKeys.filter(key => {
          const item = MOCK_WORDS[key];
          return item.type === selectedCategory || item.category === selectedCategory;
        });
      }, [selectedCategory, baseKeys]);

      // 검색창 입력값 기준 실시간 필터링 (단어, 한자, 뜻풀이 매칭)
      const filteredWords = useMemo(() => {
        const trimmed = searchTerm.trim();
        if (!trimmed) return categoryFilteredWords;
        const query = trimmed.toLowerCase();
        return categoryFilteredWords.filter(key => {
          const item = MOCK_WORDS[key];
          if (!item) return false;
          const wordMatch = cleanWordText(item.word).toLowerCase().includes(query);
          const hanjaMatch = item.hanja && item.hanja.includes(trimmed);
          const briefMatch = item.brief && item.brief.toLowerCase().includes(query);
          return wordMatch || hanjaMatch || briefMatch;
        });
      }, [categoryFilteredWords, searchTerm]);

      // 기출 빈도순 정렬 처리 추가
      const sortedAndFilteredWords = useMemo(() => {
        let result = [...filteredWords];
        if (sortByFrequency) {
          result.sort((a, b) => {
            const itemA = MOCK_WORDS[a];
            const itemB = MOCK_WORDS[b];
            if (!itemA || !itemB) return 0;
            const freqA = itemA.frequency !== undefined ? Number(itemA.frequency) : (itemA.contexts ? itemA.contexts.length : 0);
            const freqB = itemB.frequency !== undefined ? Number(itemB.frequency) : (itemB.contexts ? itemB.contexts.length : 0);
            return freqB - freqA;
          });
        }
        return result;
      }, [filteredWords, sortByFrequency]);

      const activeFeed = useMemo(() => {
        if (!selectedWord) return [];
        return dynamicFeeds[selectedWord.word] || selectedWord.feed;
      }, [selectedWord, dynamicFeeds]);

      const renderContentWithBold = (content) => {
        if (!content) return "";
        const parts = content.split(/\*\*([^*]+)\*\*/g);
        return parts.map((part, index) => {
          if (index % 2 === 1) {
            // 강조된 지문 단어명이 현재 상세 뷰어의 표제어와 부합하는지 검증
            const cleanWord = selectedWord ? selectedWord.word.replace(/\(.*?\)/g, "").trim() : "";

                            return (
                              <button
                                key={oIdx}
                                onClick={() => handleSelectOption(oIdx)}
                                disabled={hasAnswered}
                                className={`w-full text-left p-4 rounded-2xl border text-sm transition-all flex items-center justify-between ${btnStyle}`}
                                style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}
                              >
                                <span className="font-serif tracking-widest text-base">
                                  {oIdx + 1}. {opt}
                                </span>
                                {hasAnswered && (
                                  isCorrectOpt ? (
                                    <span className="text-green-600 font-bold text-xs">🎉 정답</span>
                                  ) : isSelected ? (
                                    <span className="text-red-600 font-bold text-xs">❌ 오답</span>
                                  ) : null
                                )}
                              </button>
                            );
                          })}
                        </div>

                        {/* 피드백 및 해설 영역 */}
                        {selectedOptionIndex !== null && (
                          <div className="p-5 bg-classicBg/60 border border-classicBorder rounded-2xl space-y-2 animate-fade-in">
                            <div className="flex items-center gap-2">
                              <span className={`text-xs font-bold uppercase px-2.5 py-0.5 rounded border ${
                                question.options[selectedOptionIndex] === question.correctHanja
                                  ? "bg-green-500/10 text-green-700 border-green-500/20"
                                  : "bg-red-500/10 text-red-700 border-red-500/20"
                              }`}>
                                {question.options[selectedOptionIndex] === question.correctHanja ? "정답 피드백" : "오답 피드백"}
                              </span>
                              <span className="text-xs text-classicMuted font-bold">
                                해답: {question.correctHanja} ({cleanWordText(question.word)})
                              </span>
                            </div>
                            <p className="text-sm font-serif font-black text-classicText">
                              “{question.brief}”
                            </p>
                            <p className="text-xs text-classicMuted leading-relaxed">
                              사전적 정의: {question.definition}
                            </p>
                            
                            <div className="flex justify-end pt-2">
                              <button
                                onClick={handleNextQuestion}
                                className="px-5 py-2 bg-classicRed text-white hover:bg-opacity-95 text-xs font-bold rounded-xl transition-all shadow-sm flex items-center gap-1"
                                style={{display: 'flex', alignItems: 'center'}}
                              >
                                {currentQuizIndex < 4 ? "다음 문제" : "결과 보기"} <ArrowRightIcon className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })()
                ) : (
                  // --- 스코어보드 결과 화면 ---
                  <div className="text-center py-6 space-y-6 flex flex-col items-center">
                    <div className="w-16 h-16 rounded-full bg-classicRed/10 flex items-center justify-center text-3xl animate-bounce">
                      🎓
                    </div>
                    
                    <div className="space-y-2">
                      <h3 className="text-2xl font-serif font-black text-classicText">미니 퀴즈 학습 완료!</h3>
                      <p className="text-sm text-classicMuted">5문제 중 총 <span className="text-classicRed font-black text-lg">{quizScore}문제</span> 맞추셨습니다.</p>
                    </div>

                    {/* 스코어별 피드백 메시지 */}
                    <div className="bg-classicBg/60 border border-classicBorder rounded-2xl p-4 max-w-sm w-full text-sm font-serif font-bold text-classicText">
                      {quizScore === 5 && "🎓 수석 합격 페이스! 한자 어휘 마스터입니다."}
                      {quizScore >= 3 && quizScore <= 4 && "👏 합격 안정권입니다! 리트 문맥력이 훌륭해요."}
                      {quizScore < 3 && "💪 아쉽습니다! 지문 자구 풀이를 통해 복습해 봅시다."}
                    </div>

                    <div className="flex gap-3 w-full max-w-sm" style={{display: 'flex', gap: '0.75rem', width: '100%', justifyContent: 'center'}}>
                      <button
                        onClick={handleStartQuiz}
                        className="flex-1 py-3 bg-classicRed text-white hover:bg-opacity-95 text-xs font-bold rounded-xl shadow-md transition-all"
                      >
                        다시 풀기
                      </button>
                      <button
                        onClick={() => setShowQuizModal(false)}
                        className="flex-1 py-3 bg-white hover:bg-classicBg border border-classicBorder text-classicText text-xs font-bold rounded-xl transition-all"
                      >
                        종료
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Admin Panel Drawer Modal */}
          {/* 관리자 패널 비밀번호 인증 모달 */}
          {showAdminAuth && (
            <div className="fixed inset-0 bg-classicText/40 backdrop-blur-sm z-[9999] flex items-center justify-center p-4" style={{display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
              <div className="w-full max-w-xs bg-white rounded-2xl shadow-2xl p-6 border border-classicBorder">
                <h3 className="text-sm font-bold text-classicText flex items-center gap-2 mb-1" style={{display: 'flex', alignItems: 'center'}}>
                  <span>🔒</span> 관리자 인증
                </h3>
                <p className="text-[11px] text-classicMuted mb-4">데이터 수정 툴은 비밀번호로 보호되어 있습니다.</p>
                <form onSubmit={handleAdminAuthSubmit} className="space-y-3">
                  <input
                    type="password"
                    autoFocus
                    value={adminPasswordInput}
                    onChange={(e) => setAdminPasswordInput(e.target.value)}
                    placeholder="비밀번호 입력"
                    className="w-full p-2.5 border border-classicBorder rounded-xl text-sm focus:outline-none focus:border-classicRed transition-all"
                  />
                  {adminAuthError && (
                    <p className="text-[11px] font-bold text-classicRed">{adminAuthError}</p>
                  )}
                  <div className="flex items-center gap-2" style={{display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
                    <button
                      type="button"
                      onClick={() => setShowAdminAuth(false)}
                      className="flex-1 py-2 text-xs font-bold text-classicMuted border border-classicBorder rounded-xl hover:bg-classicBg transition-all"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 text-xs font-bold text-white bg-classicRed rounded-xl hover:bg-classicRed/90 transition-all"
                    >
                      확인
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showAdmin && (
            <div className="fixed inset-0 bg-classicText/40 backdrop-blur-sm z-[9999] flex justify-end transition-all duration-300">
              <div className="w-full max-w-lg bg-white h-full shadow-2xl p-6 overflow-y-auto flex flex-col justify-between border-l border-classicBorder">
                <div className="space-y-6">
                  <div className="flex items-center justify-between border-b border-classicBorder pb-4" style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                    <h3 className="text-lg font-bold text-classicText flex items-center gap-2">
                      <span>🛠️</span> 교수님 전용 데이터 관리자 툴
                    </h3>
                    <div className="flex items-center gap-2" style={{display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
                      <button 
                        onClick={handleAdminLock}
                        title="인증을 해제하고 닫기 (다음에 다시 열 때 비밀번호 필요)"
                        className="text-classicMuted hover:text-classicRed text-xs font-bold border border-classicBorder px-2.5 py-1 rounded-lg bg-classicBg hover:bg-classicBg/60 transition-all"
                      >
                        🔒 잠그기
                      </button>
                      <button 
                        onClick={() => setShowAdmin(false)}
                        className="text-classicMuted hover:text-classicRed text-xs font-bold border border-classicBorder px-2.5 py-1 rounded-lg bg-classicBg hover:bg-classicBg/60 transition-all"
                      >
                        닫기
                      </button>
                    </div>
                  </div>

                  {/* 파일 연결 상태 안내 */}
                  {supportsFileSystemAccess ? (
                    <div className={"rounded-xl p-3 text-xs font-semibold flex items-center justify-between gap-2 " + (connectedFileHandle ? "bg-emerald-50 border border-emerald-200 text-emerald-700" : "bg-classicBg border border-classicBorder text-classicMuted")} style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                      <span>
                        {connectedFileHandle ? `🔗 연결됨: ${connectedFileHandle.name}` : "⚠️ leet_data.js 파일이 아직 연결되지 않았습니다"}
                      </span>
                      <button
                        onClick={handleConnectDataFile}
                        className="px-2.5 py-1 rounded-lg bg-white border border-classicBorder text-classicText hover:border-classicRed hover:text-classicRed transition-all text-[11px] font-bold shrink-0"
                      >
                        {connectedFileHandle ? "다른 파일로 변경" : "파일 연결하기"}
                      </button>
                    </div>
                  ) : (
                    <div className="rounded-xl p-3 text-[11px] font-medium bg-classicBg border border-classicBorder text-classicMuted">
                      ⚠️ 이 브라우저(또는 이 실행 환경)는 파일 자동저장 기능을 지원하지 않습니다. Chrome/Edge로 <code>http://localhost</code> 형태 주소에서 열면 사용할 수 있어요. 지금은 기존처럼 다운로드 방식으로 저장됩니다.
                    </div>
                  )}

                  {/* Word Selector */}
                  <div className="space-y-2">
                    <label className="text-xs font-bold text-classicMuted">수정할 어휘 선택 ({Object.keys(MOCK_WORDS).length}개 로드됨)</label>
                    <input
                      type="text"
                      value={adminSearchTerm}
                      onChange={(e) => setAdminSearchTerm(e.target.value)}
                      placeholder="어휘 검색 (단어 또는 한자)"
                      className="w-full text-sm p-2.5 border border-classicBorder rounded-xl bg-white font-serif focus:outline-none focus:border-classicRed transition-all mb-1.5"
                    />
                    <select
                      value={adminSelectedWordKey}
                      onChange={(e) => setAdminSelectedWordKey(e.target.value)}
                      className="w-full text-sm p-3 border border-classicBorder rounded-xl bg-classicBg font-serif focus:outline-none focus:border-classicRed transition-all"
                    >
                      <option value="">-- 어휘 선택 --</option>
                      {Object.keys(MOCK_WORDS).sort().filter(k => {
                        const q = adminSearchTerm.trim();
                        if (!q) return true;
                        const w = MOCK_WORDS[k];
                        return (w.word && w.word.includes(q)) || (w.hanja && w.hanja.includes(q));
                      }).map(k => (
                        <option key={k} value={k}>
                          {MOCK_WORDS[k].word} ({MOCK_WORDS[k].hanja})
                        </option>
                      ))}
                    </select>
                  </div>

                  {adminSelectedWordKey && MOCK_WORDS[adminSelectedWordKey] && (
                    <div className="space-y-4 pt-2 border-t border-classicBorder/50">
                      {/* Word Name */}
                      <div className="grid grid-cols-2 gap-4" style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem'}}>
                        <div className="space-y-1">
                          <label className="text-[11px] font-bold text-classicMuted">단어명 (한글)</label>
                          <input 
                            type="text"
                            value={editWord}
                            onChange={(e) => setEditWord(e.target.value)}
                            className="w-full p-2.5 border border-classicBorder rounded-xl text-xs focus:outline-none focus:border-classicRed transition-all"
                          />
                        </div>
                        <div className="space-y-1">
                          <label className="text-[11px] font-bold text-classicMuted">한자 표기</label>
                          <input 
                            type="text"
                            value={editHanja}
                            onChange={(e) => setEditHanja(e.target.value)}
                            className="w-full p-2.5 border border-classicBorder rounded-xl text-xs focus:outline-none focus:border-classicRed transition-all"
                          />
                        </div>
                      </div>

                      {/* Brief Explanation */}
                      <div className="space-y-1">
                        <label className="text-[11px] font-bold text-classicMuted">뜻풀이 (Brief)</label>
                        <textarea
                          rows="2"
                          value={editBrief}
                          onChange={(e) => setEditBrief(e.target.value)}
                          className="w-full p-2.5 border border-classicBorder rounded-xl text-xs focus:outline-none focus:border-classicRed transition-all resize-none"
                        />
                      </div>

                      {/* Contexts Editing */}
                      <div className="space-y-3">
                        <label className="text-[11px] font-bold text-classicMuted block border-b border-classicBorder/30 pb-1">
                          기출 지문 문맥 및 학습 팁 ({editContexts.length}건 등록됨)
                        </label>
                        {editContexts.map((ctx, idx) => (
                          <div key={idx} className="p-3 border border-classicBorder rounded-xl bg-classicBg/40 space-y-2.5">
                            <div className="flex items-center justify-between" style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                              <span className="text-[10px] font-bold text-classicRed">문맥 #{idx + 1}</span>
                              <input 
                                type="text"
                                value={ctx.source || ""}
                                onChange={(e) => {
                                  const val = e.target.value;
                                  setEditContexts(prev => {
                                    const next = [...prev];
                                    next[idx].source = val;
                                    return next;
                                  });
                                }}
                                className="w-1/2 p-1 px-2 border border-classicBorder rounded text-[10px] focus:outline-none focus:border-classicRed bg-white"
                                placeholder="출처 (예: 2026학년도 추리논증)"
                              />
                            </div>
                            
                            <div className="space-y-1">
                              <label className="text-[9px] font-bold text-classicMuted">기출 지문 예문</label>
                              <textarea
                                rows="3"
                                value={ctx.desc || ctx.content || ""}
                                onChange={(e) => {
                                  const val = e.target.value;
                                  setEditContexts(prev => {
                                    const next = [...prev];
                                    if (next[idx].desc !== undefined) next[idx].desc = val;
                                    if (next[idx].content !== undefined) next[idx].content = val;
                                    return next;
                                  });
                                }}
                                className="w-full p-2 border border-classicBorder rounded text-xs focus:outline-none focus:border-classicRed bg-white resize-none"
                                placeholder="실제 기출 예문을 입력하세요."
                              />
                            </div>

                            <div className="space-y-1">
                              <label className="text-[9px] font-bold text-classicMuted">독해 팁 (Tip)</label>
                              <input 
                                type="text"
                                value={ctx.tip || ""}
                                onChange={(e) => {
                                  const val = e.target.value;
                                  setEditContexts(prev => {
                                    const next = [...prev];
                                    next[idx].tip = val;
                                    return next;
                                  });
                                }}
                                className="w-full p-2 border border-classicBorder rounded text-xs focus:outline-none focus:border-classicRed bg-white"
                                placeholder="수험생에게 제공할 독해 팁을 작성하세요."
                              />
                            </div>
                          </div>
                        ))}
                      </div>

                      <button
                        onClick={handleSaveWord}
                        className="w-full py-2.5 bg-classicTeal text-white text-xs font-bold rounded-xl shadow-sm hover:bg-classicTeal/90 hover:shadow-md transition-all duration-300"
                      >
                        메모리 임시 저장
                      </button>
                    </div>
                  )}
                </div>

                {/* Footer Controls (Export / Save Data) */}
                <div className="border-t border-classicBorder pt-4 mt-6 space-y-2">
                  <button
                    onClick={handleExportData}
                    className="w-full py-3 bg-classicRed text-white text-xs font-bold rounded-xl shadow-md hover:bg-classicRed/95 hover:shadow-lg transition-all duration-300 flex items-center justify-center gap-2"
                    style={{display: 'flex', justifyContent: 'center', alignItems: 'center'}}
                  >
                    <span>{connectedFileHandle ? "💾 연결된 leet_data.js에 바로 저장" : "💾 새 데이터 파일 생성 (leet_data.js)"}</span>
                  </button>
                  <p className="text-[10px] text-classicMuted text-center">
                    {connectedFileHandle
                      ? "저장 버튼을 누르면 다운로드 없이 연결된 파일에 바로 반영됩니다."
                      : "다운로드한 leet_data.js 파일을 프로젝트의 js/ 폴더 안에 덮어씌우면 화면에 영구 갱신됩니다."}
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* Toast Message */}
          {toastMessage && (
            <div className="fixed bottom-12 left-1/2 transform -translate-x-1/2 z-[99999] bg-[#252030] text-white px-5 py-3 rounded-xl shadow-2xl border border-classicBorder/20 flex items-center gap-2 text-xs font-bold tracking-wide pointer-events-none animate-fade-in-up">
              <span className="text-[#A78BFA]">✨</span> {toastMessage}
            </div>
          )}

          {/* Footer */}
          <footer className="mt-auto border-t border-classicBorder pt-8 text-center text-xs text-classicMuted space-y-2 pb-6">
            <p>© 2026 한알국쉬(리트버전) & Baek Jinwoo. All rights reserved.</p>
            <p className="font-serif font-medium text-[10px] uppercase tracking-widest text-classicMuted">
              편찬 책임자: 백진우 <span className="cursor-pointer select-none opacity-20 hover:opacity-100 hover:text-classicRed transition-all" onClick={handleAdminBulletClick}>•</span> 한자를 알면 리트(LEET)가 쉬워 • POWERED BY REACT & TAILWIND CSS
            </p>
          </footer>

        </div>
      );
    }

    // Mount to Root (React 17 Style)
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
  <!-- 인쇄 전용 아날로그 단어장 컨테이너 (Print CSS 용) -->
  <div id="print-zone" class="print-area max-w-4xl mx-auto p-8 bg-white text-black font-sans">
    <div class="border-b-4 border-black pb-4 mb-6" style="border-bottom: 4px solid #000000; padding-bottom: 12px; margin-bottom: 24px;">
      <h1 class="text-3xl font-serif font-black text-black">한알국쉬(리트버전) 아날로그 휴대 단어장</h1>
      <p class="text-sm text-gray-600 mt-1">LEET 언어이해 & 추리논증 기출 10개년 엄선 핵심 어휘집 (총 <span id="print-total-count">...</span>개 수록)</p>
    </div>
    <div id="print-list" class="print-grid"></div>
  </div>

  <script>
    // 인쇄 전용 영역에 단어 목록을 가나다순으로 자동 렌더링합니다. (1.5초 딜레이 제거)
    function renderPrintArea() {
      var printList = document.getElementById('print-list');
      var printTotalCount = document.getElementById('print-total-count');
      if (!printList || !window.MOCK_WORDS) return;
      if (printList.children.length > 0) return; // 이미 렌더링된 경우 중복 실행 방지
      
      var keys = Object.keys(window.MOCK_WORDS).sort();
      if (printTotalCount) {
        printTotalCount.textContent = keys.length;
      }
      
      var html = '';
      keys.forEach(function(key) {
        var item = window.MOCK_WORDS[key];
        var contextsHtml = '';
        if (item.contexts && item.contexts.length > 0) {
          var firstContext = item.contexts[0];
          contextsHtml = '<div style="margin-top: 6px; padding: 6px; background: #F9FAFB; border-radius: 6px; font-size: 10px; color: #4B5563; font-style: italic; border: 1px solid #E5E7EB;">' + 
            '🔍 ' + (firstContext.content || firstContext.desc || '').replace(/\*\*/g, "") + 
            '</div>';
        }
        var cleanWord = (item.word || key).replace(/\(.*?\)/g, "").replace(/_\d+/g, "").trim();
        html += '<div class="print-card flex flex-col justify-between gap-2 border border-gray-300 p-4 rounded-xl" style="border: 1px solid #D1D5DB; border-radius: 12px; padding: 16px; margin-bottom: 10px; page-break-inside: avoid; break-inside: avoid;">' +
          '<div>' +
            '<div class="flex items-center justify-between border-b pb-1 mb-2" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #E5E7EB; padding-bottom: 4px; margin-bottom: 8px;">' +
              '<span style="font-size: 10px; font-weight: bold; color: #4B5563;">' + (item.category || item.type || '어휘') + '</span>' +
              '<span style="font-size: 9px; color: #9CA3AF;">기출 ' + (item.contexts ? item.contexts.length : 0) + '건</span>' +
            '</div>' +
            '<h3 class="text-lg font-serif font-black text-black" style="font-size: 18px; margin: 0; color: #000000;">' + cleanWord + ' <span class="text-xs font-normal text-gray-500 font-sans" style="font-size: 12px; color: #6B7280; font-weight: normal;">(' + (item.hanja || '') + ')</span></h3>' +
            '<p class="text-xs text-gray-700 mt-1 font-medium" style="font-size: 12px; color: #374151; margin-top: 4px;">' + (item.brief || '') + '</p>' +
            contextsHtml +
          '</div>' +
        '</div>';
      });
      printList.innerHTML = html;
      console.log("DEBUG: Print area dynamic binding completed. Words count: " + keys.length);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderPrintArea);
    } else {
      renderPrintArea();
    }
    window.addEventListener('beforeprint', renderPrintArea);
  </script>
</body>
</html>
